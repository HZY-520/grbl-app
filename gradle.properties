# iGRBL 3.0 原生工程 Gradle 设置
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ⚠️ 必须使用「完整 JDK」：AGP 需要 jlink，IntelliJ 自带的 JBR 没有。
#    环境变量 JAVA_HOME 当前指向 JBR，因此这里显式指定 JDK 17。
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.18

android.useAndroidX=true
android.nonTransitiveRClass=true

# 仓库路径含中文（D:\工作台\iGRBL），AGP 默认会拒绝；本工程不使用 NDK。
android.overridePathCheck=true

kotlin.code.style=official
